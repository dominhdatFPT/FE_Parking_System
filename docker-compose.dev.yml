version: '3.8'

# Development environment - Lightweight, quick builds
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: parking-system-fe-dev
    ports:
      - "3000:80"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8080
    networks:
      - parking-network-dev
    restart: unless-stopped

networks:
  parking-network-dev:
    driver: bridge
