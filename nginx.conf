server {
    listen 80;

    # ================================
    # Serve React SPA
    # ================================
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Quan trọng: redirect mọi route về index.html
        # để React Router tự xử lý (tránh lỗi 404 khi F5)
        try_files $uri $uri/ /index.html;
    }

    # ================================
    # Proxy API sang Backend
    # ================================
    # FE gọi /api/... → Nginx forward sang Spring Boot
    # Không bị lỗi CORS vì cùng origin
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các request lâu (upload, report...)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ================================
    # Tối ưu cache cho static assets
    # ================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
