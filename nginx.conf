server {
    listen 80;

    # Five verification images are sent as base64 JSON. Keep this above the
    # client-side 5 x 4 MB limit (base64 adds roughly 33% overhead).
    client_max_body_size 30m;

    # ================================
    # Serve React SPA
    # ================================
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # index.html phải luôn fresh — Vite đổi hash trong tên file JS/CSS mỗi build,
        # nên index.html mới sẽ reference file JS/CSS mới.
        add_header Cache-Control "no-cache, must-revalidate";

        # Quan trọng: redirect mọi route về index.html
        # để React Router tự xử lý (tránh lỗi 404 khi F5)
        try_files $uri $uri/ /index.html;
    }

    # ================================
    # Proxy API sang Backend
    # ================================
    # FE gọi /api/... → Nginx forward sang Spring Boot
    # Không bị lỗi CORS vì cùng origin
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các request lâu (upload, report...)
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ================================
    # Tối ưu cache cho static assets
    # Vite hashes filenames mỗi build, nên cache 1 năm OK.
    # Nếu cần force refresh, dùng Ctrl+Shift+R hoặc clear browser cache.
    # ================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
