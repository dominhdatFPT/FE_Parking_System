version: '3.8'

services:
  # =============================================
  # Frontend - React + Vite + Nginx
  # =============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parking-system-fe
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - parking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================
  # Backend - Spring Boot (nếu cần chạy cùng)
  # =============================================
  backend:
    image: backend-service:latest
    container_name: parking-system-backend
    ports:
      - "8080:10000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/parking_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - parking-network
    restart: unless-stopped
    build:
      context: ../BE  # Đường dẫn đến folder Backend
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================
  # MySQL Database
  # =============================================
  mysql:
    image: mysql:8.0
    container_name: parking-system-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=parking_db
      - MYSQL_USER=parking_user
      - MYSQL_PASSWORD=parking123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - parking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =============================================
  # phpMyAdmin - Quản lý Database (tùy chọn)
  # =============================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: parking-system-phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root123
      - PMA_DATABASE=parking_db
    depends_on:
      - mysql
    networks:
      - parking-network
    restart: unless-stopped

# =============================================
# Networks
# =============================================
networks:
  parking-network:
    driver: bridge

# =============================================
# Volumes
# =============================================
volumes:
  mysql_data:
    driver: local
